[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "giye"
version = "0.1.0"
description = "Evidence-gated, provenance-first archiving of a creative field from public rosters and CVs."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Joonhyung Bae" }]
requires-python = ">=3.10"
keywords = ["archive", "provenance", "census", "person register", "record linkage", "media art", "web archiving"]
# Linux and macOS are tested in CI. Windows is not supported: the ledger lock uses fcntl.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: System :: Archiving",
]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2.31",
  "warcio>=1.7",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# AnthropicProvider streams through client.beta.messages with output_config and
# betas; anthropic 0.40 has no client.beta.messages.stream, so the floor is 1.0.
llm = ["anthropic>=1.0"]
# Only `python -m giye.audit splink`, the comparison with a probabilistic linker, imports it.
splink = ["splink>=5.0"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://giye.org"
Source = "https://github.com/joonhyungbae/giye"
Documentation = "https://github.com/joonhyungbae/giye/tree/main/docs"
Issues = "https://github.com/joonhyungbae/giye/issues"
Changelog = "https://github.com/joonhyungbae/giye/blob/main/CHANGELOG.md"

[project.scripts]
giye = "giye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Every non-Python file under src/giye is package data. tests/test_packaging.py
# checks that each tracked data file matches one of these patterns.
giye = [
  "normalize/data/**/*.yaml",
  "normalize/data/**/*.tsv",
  "normalize/data/**/*.txt",
  "normalize/data/**/*.json",
  "extract/prompts/*.txt",
  "fields/*/field.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
