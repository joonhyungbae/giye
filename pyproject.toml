[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giye"
version = "0.1.0.dev0"
description = "Provenance-first census archives of creative fields: collect, extract, resolve, normalize, explore, publish."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joonhyung Bae" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "requests>=2.31",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "pydantic>=2"]
embed = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
giye = "giye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
