[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giye"
version = "0.1.0"
description = "Evidence-gated, provenance-first archiving of a creative field from public rosters and CVs."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Joonhyung Bae" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2.31",
  "warcio>=1.7",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embed = ["sentence-transformers>=3"]
# Clustering libraries the archive used to build candidate divisions. The core
# scores (adjusted Rand, lift, AUC) do not import them.
explore = ["scikit-learn>=1.3", "igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
giye = "giye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
giye = [
  "normalize/data/ko_en/*.yaml",
  "normalize/data/ko_en/*.tsv",
  "normalize/data/ko_en/*.txt",
  "normalize/data/ko_en/countries/*.json",
  "extract/prompts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
