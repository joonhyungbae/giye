# Demo archive: a synthetic field (no real people). Used by tests and the one-command reproduction.
[archive]
name = "Synthetic media-art field (demo)"
id_prefix = "GY"
territory = "KR"
languages = ["ko", "en"]

[paths]
data = "data"
frames = "frames.yml"

[collect]
user_agent = "GiyeDemo/0.1 (+https://example.org/contact)"
min_delay_s = 0.0
timeout_s = 20
robots_timeout_s = 10
collector_modules = ["collectors.py"]

# The demo never opens a socket. These prefixes are read from local directories after robots.txt.
[collect.offline_roots]
"https://example.org" = "fixtures"
"https://cv.example.org" = "cvs"

[extract]
model = "claude-opus-5"
temperature = 0
cache = "cache"

# The Korean CV attaches to the residency row 김하늘. The English CV attaches to
# the workshop row Haneul Kim, and names the residency, so resolve can merge
# them (X1+E2). source_id is fixed so the hand-written replay cache can name
# the document before a ledger id exists.
[[extract.sources]]
name_ko = "김하늘"
lang = "ko"
url = "https://cv.example.org/haneul-ko"
source_id = "CV-DEMO-HANEUL-ko"
note = "fictitious Korean CV; writes 서울시립미술관 외"

[[extract.sources]]
name_en = "Haneul Kim"
lang = "en"
url = "https://cv.example.org/haneul-en"
source_id = "CV-DEMO-HANEUL-en"
note = "fictitious English CV; lists Example Residency and Seoul Museum of Art"

[[extract.sources]]
name_ko = "최민수"
lang = "mixed"
url = "https://cv.example.org/minsoo-mixed"
source_id = "CV-DEMO-MINSOO-mixed"
note = "fictitious mixed-language CV"

[resolve]
# Local HTML CVs. Matched to a ledger row by data-name-ko and data-name-en.
cv_dir = "fixtures/cv"

# E2. These fictitious programmes are not in the production pattern list.
[resolve.event_patterns]
EXAMPLE-RESIDENCY = "예시 ?레지던시|example residency"
EXAMPLE-WORKSHOP = "예시 ?워크숍|example workshop"

# Citations point at example.org, not the reference deployment.
[publish]
site_url = "https://example.org"
dataset_version = "0.2"
dataset_title = "Synthetic media-art field (demo)"
citation_author = "Example Archive"
