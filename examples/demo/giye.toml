# Demo archive: a synthetic field (no real people). Used by tests and the one-command reproduction.
[archive]
name = "Synthetic media-art field (demo)"
id_prefix = "GY"
territory = "KR"
languages = ["ko", "en"]

[paths]
data = "data"
frames = "frames.yml"

[collect]
user_agent = "GiyeDemo/0.1 (+https://example.org/contact)"
min_delay_s = 0.0
timeout_s = 20
robots_timeout_s = 10
collector_modules = ["collectors.py"]

# The demo never opens a socket. These prefixes are read from fixtures/ after robots.txt.
[collect.offline_roots]
"https://example.org" = "fixtures"

[evidence]
# Public default. A robots.txt disallow is not replaced with an Internet Archive capture.
archive_fallback_for_disallowed = false

[resolve]
# Local HTML CVs. Matched to a ledger row by data-name-ko and data-name-en.
cv_dir = "fixtures/cv"

# E2. These fictitious programmes are not in the production pattern list.
[resolve.event_patterns]
EXAMPLE-RESIDENCY = "예시 ?레지던시|example residency"
EXAMPLE-WORKSHOP = "예시 ?워크숍|example workshop"
