name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. Linux only: the deployment target is Linux, and the macOS jobs
    # hung in pytest (2026-10-07), so macOS is not tested rather than reported as supported.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      # A per-test limit: a hang fails fast with the test's name and a stack dump
      # instead of holding the runner until the job timeout.
      - run: pytest -q --timeout=120 --timeout-method=thread
  # Type annotations are reported, not enforced: mypy still finds errors in
  # modules other work is changing. Make this blocking once it passes.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy types-PyYAML types-requests
      - run: mypy --ignore-missing-imports src/giye
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        run: bun install && bunx tsc --noEmit -p . && bun run build
