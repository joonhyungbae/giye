# Generic institution words for the Korean–English module (rule V9).
# Each key is a source-script word. Each list item is one reading: an ordered
# list of tokens in the other script. The first reading is the primary one
# (현대 = contemporary, then modern). An empty reading is dropped: 시립·도립·군립·구립
# have no English counterpart in most house names (서울시립미술관 = Seoul Museum of Art).
