<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .i { stroke: #181a1c; fill: none; }
    .d { fill: #181a1c; }
    @media (prefers-color-scheme: dark) {
      .i { stroke: #f1f2ef; }
      .d { fill: #f1f2ef; }
    }
  </style>
  <!-- rim: frame-group arcs with small gaps -->
  <circle class="i" cx="16" cy="16" r="14" stroke-width="2.2"
    stroke-dasharray="19.5 2.49" transform="rotate(-40 16 16)" />
  <!-- year rings -->
  <circle class="i" cx="16" cy="16" r="9.5" stroke-width="1.3" opacity="0.55" />
  <circle class="i" cx="16" cy="16" r="5" stroke-width="1.3" opacity="0.55" />
  <!-- records -->
  <circle class="d" cx="24.2" cy="11.3" r="1.7" />
  <circle class="d" cx="9.3" cy="22.7" r="1.7" />
  <circle class="d" cx="12.1" cy="12.9" r="1.5" />
  <circle class="d" cx="20.6" cy="17.9" r="1.5" />
  <circle class="d" cx="16" cy="16" r="1.6" />
</svg>
